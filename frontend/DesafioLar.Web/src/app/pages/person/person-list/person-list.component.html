<div class="page">

  <div class="page-header">
    <div>
      <h1>Pessoas</h1>
      <p>Gerencie as pessoas cadastradas</p>
    </div>

    <button mat-flat-button class="primary-button" routerLink="/person/new">
      <mat-icon>add</mat-icon>
      Nova pessoa
    </button>
  </div>

  <div class="table-container">

    <table mat-table [dataSource]="person">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let person">
          {{ person.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="cpf">
        <th mat-header-cell *matHeaderCellDef>CPF</th>
        <td mat-cell *matCellDef="let person">
          {{ person.cpf }}
        </td>
      </ng-container>

      <ng-container matColumnDef="birthDate">
        <th mat-header-cell *matHeaderCellDef>Data de nascimento</th>
        <td mat-cell *matCellDef="let person">
          {{ person.birthDate | date:'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let person">
          {{ person.isActive ? 'Ativo' : 'Inativo' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>

        <td mat-cell *matCellDef="let person">

          <button mat-icon-button aria-label="Visualizar pessoa" [routerLink]="['/person', person.id]">
            <mat-icon>visibility</mat-icon>
          </button>

          <button mat-icon-button aria-label="Editar pessoa" [routerLink]="['/person', person.id, 'edit']">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button aria-label="Excluir pessoa" (click)="remove(person)">

            <mat-icon>delete</mat-icon>

          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

    @if (person.data.length === 0) {
    <div class="empty-state">
      Nenhuma pessoa cadastrada.
    </div>
    }

  </div>

</div>
